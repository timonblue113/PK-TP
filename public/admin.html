<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7ea4">
<meta name="robots" content="noindex">
<title>Bác sĩ – Danh sách khám</title>
<style>
:root{--bg:#f4f8fb;--card:#fff;--text:#0f2a3d;--muted:#5b7183;--pri:#0a7ea4;--line:#d8e3ec;--err:#b42318;--ok:#16794c}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a24;--card:#12263a;--text:#e8f1f7;--muted:#93a9ba;--pri:#3bb2d8;--line:#24425a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
input,select,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
button{cursor:pointer;font-weight:600}.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.t{border:2px solid var(--line)}.t.on{border-color:var(--pri);background:var(--pri);color:#fff}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--pri);border-radius:12px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:56px 1fr;gap:12px}
.item.urgent{border-left-color:var(--err)}.item.done{opacity:.55}
.no{font-size:34px;font-weight:800;color:var(--pri);text-align:center}.urgent .no{color:var(--err)}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--pri) 15%,transparent);color:var(--pri);margin-right:6px}
.b.r{background:#fdecea;color:var(--err)}
.sm{font-size:14px;color:var(--muted);margin:4px 0}.sm b{color:var(--text)}
.act{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.act button{padding:6px 12px;font-size:13px}
#login{max-width:340px;margin:60px auto;display:grid;gap:10px}
@media print{.bar,.act{display:none}.item{break-inside:avoid}}

/* ===== Tối ưu điện thoại ===== */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select{touch-action:manipulation;font-size:16px;min-height:46px}
.act button{min-height:44px;padding:8px 14px;font-size:15px;flex:1}
.item a{display:inline-block;padding:2px 0;font-weight:700}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
@media(max-width:520px){main{padding:10px}.item{grid-template-columns:44px 1fr;padding:12px;gap:8px}.no{font-size:28px}#login{margin:30px auto;padding:0 14px}}
</style>
</head>
<body>
<main>
<div id="login"><h1>Đăng nhập bác sĩ</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password">
  <button class="pri" id="lg">Đăng nhập</button><div id="le" style="color:var(--err)"></div></div>

<div id="panel" style="display:none">
  <h1>Danh sách khám</h1>
  <div class="bar">
    <input type="date" id="dt">
    <button class="t on" data-d="nhi">👶 Nhi</button><button class="t" data-d="san">🤰 Sản</button>
    <button id="rf">Làm mới</button><button id="pr">In</button><button id="lo">Thoát</button>
  </div>
  <div id="sum" class="sm"></div><div id="list"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let dept="nhi", timer;
$("dt").value = new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Ho_Chi_Minh"});

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  $("login").style.display=session?"none":"grid"; $("panel").style.display=session?"block":"none";
  if(session){
    const {data:ok}=await sb.rpc("is_admin");
    if(!ok){ await sb.auth.signOut(); $("login").style.display="grid"; $("panel").style.display="none"; $("le").textContent="Tài khoản này chưa được cấp quyền bác sĩ."; return; }
    load(); clearInterval(timer); timer=setInterval(load,30000);
  }
}
$("lg").onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error) $("le").textContent="Sai email hoặc mật khẩu."; else boot();
};
$("lo").onclick=async()=>{await sb.auth.signOut();clearInterval(timer);boot()};
$("rf").onclick=load; $("pr").onclick=()=>print(); $("dt").onchange=load;
document.querySelectorAll(".t").forEach(b=>b.onclick=()=>{dept=b.dataset.d;document.querySelectorAll(".t").forEach(x=>x.classList.toggle("on",x===b));load()});

async function load(){
  const {data,error}=await sb.from("tickets").select("*").eq("visit_date",$("dt").value).eq("dept",dept).neq("status","cancelled").order("queue_no");
  if(error){$("list").textContent="Không tải được dữ liệu.";return}
  const w=data.filter(x=>x.status==="waiting").length;
  $("sum").innerHTML=`Tổng <b>${data.length}</b> · Chờ khám <b>${w}</b> · Có dấu hiệu nguy hiểm <b style="color:var(--err)">${data.filter(x=>x.urgent).length}</b>`;
  $("list").innerHTML=data.map(t=>{
    const d=t.details||{}, fl=d["Dấu hiệu nguy hiểm"]||[];
    const rest=Object.entries(d).filter(([k])=>k!=="Dấu hiệu nguy hiểm").map(([k,v])=>`<b>${esc(k)}:</b> ${esc(v)}`).join(" · ");
    return `<div class="item ${t.urgent?"urgent":""} ${t.status!=="waiting"?"done":""}">
      <div class="no">${t.queue_no}</div>
      <div><div><b>${esc(t.full_name)}</b> · ${esc(t.age_text)} ${t.gender?"· "+esc(t.gender):""} · <a href="tel:${esc(t.phone)}">${esc(t.phone)}</a></div>
      <div style="margin-top:4px"><span class="b">${esc(t.category)}</span>${fl.map(f=>`<span class="b r">⚠ ${esc(f)}</span>`).join("")}</div>
      ${t.symptoms?`<div class="sm"><b>Triệu chứng:</b> ${esc(t.symptoms)}</div>`:""}
      ${rest?`<div class="sm">${rest}</div>`:""}
      <div class="sm">Đăng ký lúc ${new Date(t.created_at).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Ho_Chi_Minh"})} · ${t.status==="done"?"✅ Đã khám":t.status==="absent"?"Vắng":"Đang chờ"}</div>
      <div class="act"><button onclick="setS('${t.id}','done')">✅ Đã khám</button><button onclick="setS('${t.id}','absent')">Vắng</button><button onclick="setS('${t.id}','waiting')">Hoàn tác</button></div></div></div>`;
  }).join("") || '<div class="sm">Chưa có ai đăng ký.</div>';
}
async function setS(id,s){await sb.from("tickets").update({status:s}).eq("id",id);load()}
boot();
</script>
</body>
</html>
